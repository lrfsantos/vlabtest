--yellow-bg:var(--paper-2);--yellow-line:var(--line);--radius:8px;--radius-sm:6px;--radius-lg:8px;--shadow:none;--shadow-sm:none;--touch:48px;--max:44rem;--max-wide:60rem;color-scheme:light}

.theme-dark{--bg:#14171B;--paper:#1C2025;--paper-2:#232830;--soft2:#2E343D;--ink:#E9E7E2;--on-ink:#14171B;--muted:#B7BDC5;--line:#343A42;--line-strong:#7B848E;--accent:#8DB4F2;--accent-soft:#1F2D45;--accent-ink:#BBD3F7;--on-accent:#0E1620;--ok-bg:#1F2D45;--ok-line:#8DB4F2;--ok-ink:#BBD3F7;--bad-bg:#3A2616;--bad-line:#E58A47;--bad-ink:#FFC9A0;color-scheme:dark}
.theme-high{--bg:#000000;--paper:#000000;--paper-2:#0D0D0D;--soft2:#1A1A1A;--ink:#FFFFFF;--on-ink:#000000;--muted:#E8E8E8;--line:#FFFFFF;--line-strong:#FFFFFF;--accent:#FFE14D;--accent-soft:#262200;--accent-ink:#FFE14D;--on-accent:#000000;--ok-bg:#262200;--ok-line:#FFE14D;--ok-ink:#FFE14D;--bad-bg:#2A0F00;--bad-line:#FF9A5C;--bad-ink:#FFD1B3;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.55;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
b,strong{font-weight:700}
a{color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
::selection{background:var(--accent-soft)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.spacing-wide{letter-spacing:.05em;word-spacing:.14em;line-height:1.9}
body.spacing-wide button,body.spacing-wide .tab{line-height:1.5}

/* header */
header{max-width:var(--max);margin:0 auto;padding:16px 20px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.45rem;font-weight:400;letter-spacing:-.01em;line-height:1;margin-right:auto}
.brand b{font-weight:700}
.brand .logo{color:var(--accent);flex:none}
.stats{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:1rem;color:var(--muted)}
.stats .stat b{color:var(--ink)}
.streak{display:none}.streak.show{display:inline}
.header-controls{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1.5px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--paper)}
.seg .ts-btn+.ts-btn{border-left:1.5px solid var(--line-strong)}
.ts-btn{min-width:48px;min-height:46px;padding:0 10px;border:0;background:transparent;font-weight:700;font-size:1rem}
.ts-btn:hover,.icon-btn:hover,.menu-btn:hover{background:var(--accent-soft)}
.menu-btn{min-height:48px;padding:0 18px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--paper);font-weight:700;font-size:1rem}
.menu-btn[aria-expanded="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.icon-btn{min-width:48px;min-height:48px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--paper);display:inline-grid;place-items:center;font-size:1.05rem;font-weight:700}

/* layout */
main{max-width:var(--max);margin:0 auto;padding:12px 20px 11rem}
.top-meta,.row-btns{display:none}
h1{font-size:1.9rem;line-height:1.15;margin:12px 0 0;font-weight:700}
.sub{margin-top:6px;font-size:1rem;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:0 6px;margin-top:16px;border-bottom:1px solid var(--line)}
.tab{border:0;border-bottom:4px solid transparent;background:none;padding:10px 10px 8px;min-height:52px;font-weight:700;font-size:1.05rem;color:var(--muted);text-align:left;line-height:1.25;margin-bottom:-1px}
.tab small{display:none;font-size:.9rem;font-weight:400;color:var(--muted)}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}
.tip{margin-top:16px;padding:2px 0 2px 14px;border-left:4px solid var(--accent);font-size:1rem;line-height:1.55}
.progress-wrap{margin-top:20px;display:flex;align-items:center;gap:12px}
.progress-title{font-size:1rem;color:var(--muted)}
.progress-wrap{flex-wrap:wrap}
.progress{flex:1 1 6rem;min-width:6rem;height:10px;background:var(--soft2);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent)}
.progress-label{font-size:1rem;font-weight:700;min-width:2.6rem;text-align:right}

/* cards */
.cards{margin-top:16px;display:grid;gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.badge{display:inline-block;font-size:.9rem;color:var(--muted);border:1px solid var(--line-strong);border-radius:4px;padding:1px 10px;min-height:1.6rem}
.badge:empty{display:none}
.badge.irr{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.check{width:2rem;height:2rem;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-size:1rem;font-weight:700;color:transparent}
.check.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.big-wrap{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px 12px;margin-top:10px}
.big-wrap>div:first-child{flex:1 1 13rem;min-width:0}
.big{font-size:2.3rem;line-height:1.1;font-weight:700;overflow-wrap:break-word}
.pron{display:inline-block;margin-top:6px;margin-right:10px;font-size:1.15rem;font-weight:700;color:var(--accent-ink);letter-spacing:.02em}
.pron-tip{margin-top:10px;font-size:1rem;color:var(--muted);padding-left:12px;border-left:3px solid var(--line-strong)}
.pron-tip b{color:var(--ink)}
.pt{margin-top:10px;font-size:1.1rem;color:var(--muted)}
.ex{margin-top:16px;padding:2px 0 2px 14px;border-left:4px solid var(--accent)}
.ex .en{font-size:1.15rem;line-height:1.45;font-weight:700}
.ex .pt-br{margin-top:4px;font-size:1.02rem;color:var(--muted)}
.details{margin-top:16px}
.details summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:50px;padding:0 14px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--paper);font-weight:700;font-size:1.02rem}
.details summary::-webkit-details-marker{display:none}
.details summary:hover{background:var(--accent-soft)}
.details summary span:last-child{transition:transform .15s}
.details[open] summary span:last-child{transform:rotate(180deg)}
.grid{display:block;margin-top:12px;border-top:1px solid var(--line)}
.box{display:grid;grid-template-columns:minmax(5rem,34%) minmax(0,1fr);gap:2px 14px;align-items:baseline;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none}
.box b{font-size:.95rem;font-weight:400;color:var(--muted)}
.box span{font-size:1.15rem;font-weight:700}
.box .pron{grid-column:2;margin:0;font-size:1.02rem}
.box.dark{box-shadow:inset 4px 0 0 var(--accent);padding-left:14px}
.box.dark span:first-of-type{color:var(--accent-ink)}
.box.wide{grid-column:auto}
.box span{overflow-wrap:anywhere}
.big-text .box{grid-template-columns:minmax(0,1fr)}
.big-text .box .pron{grid-column:1}
.extra{margin-top:14px;padding-top:6px;border-top:1px solid var(--line)}
.extra>b{display:block;margin:8px 0 2px;font-size:1.02rem}
.extra-item{margin-top:8px;font-size:1.02rem;line-height:1.5}
.micro-note,.live-note{margin-top:12px;padding:10px 14px;border-left:4px solid var(--line-strong);background:var(--paper-2);border-radius:0 6px 6px 0;font-size:1rem;line-height:1.5}
.live-row{margin-top:6px;color:var(--muted)}
.colloc-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.colloc{border:1px solid var(--line-strong);border-radius:4px;padding:2px 10px;font-size:.98rem;background:var(--paper)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:14px;font-size:1.3rem;font-weight:700}
.chain .arr{color:var(--muted)}
.chain .hl{background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:2px 12px;color:var(--accent-ink)}
.speaker{min-width:48px;min-height:48px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--paper);font-size:1rem;font-weight:700}
.speaker:hover{background:var(--accent-soft)}
.speaker.slow{font-weight:400}
.speaker.playing{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.speaker .ico{width:22px;height:22px;flex:none}

/* primary action */
.cta-wrap{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line-strong);padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
.cta-inner{max-width:var(--max);margin:0 auto}
.btn-primary{width:100%;min-height:54px;padding:8px 18px;border:2px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed;filter:none}
.btn-sub{margin-top:6px;min-height:1.4rem;text-align:center;font-size:1rem;color:var(--muted)}
.link-btn{background:none;border:0;min-height:48px;padding:0 6px;color:var(--accent-ink);font-weight:700;font-size:1rem;text-decoration:underline}
.chip{min-height:46px;padding:0 16px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--paper);font-size:1rem;white-space:nowrap}
.chip:hover{background:var(--accent-soft)}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}

/* quiz */
#quiz{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:var(--bg)}
#quiz.open{display:flex}
.quiz-head{width:100%;max-width:var(--max);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.q-progress{flex:1;height:10px;background:var(--soft2);border-radius:5px;overflow:hidden}
.q-progress i{display:block;height:100%;width:0;background:var(--accent)}
.q-count{min-width:3.2rem;text-align:right;font-weight:700}
.quiz-body{width:100%;max-width:var(--max);margin:0 auto;padding:20px;overflow:auto;flex:1}
.q-prompt{margin-top:6px;font-size:1.55rem;line-height:1.3;font-weight:700}
.q-opts{margin-top:18px;display:grid;gap:12px}
.q-opt{width:100%;min-height:58px;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--paper);font-size:1.12rem}
.q-opt:hover{background:var(--accent-soft)}
.q-opt span:last-child{color:var(--muted)}
.q-opt.correct{background:var(--ok-bg);border:2px solid var(--ok-line);color:var(--ok-ink);font-weight:700}
.q-opt.wrong{background:var(--bad-bg);border:2px solid var(--bad-line);color:var(--bad-ink)}
.q-opt.correct span:first-child::before{content:"\2713\00a0"}
.q-opt.wrong span:first-child::before{content:"\2715\00a0"}
.typed-wrap{margin-top:18px}
.typed-input{width:100%;height:60px;padding:0 16px;border:2px solid var(--line-strong);border-radius:6px;background:var(--paper);font-size:1.3rem;font-weight:700}
.typed-input:focus{outline:3px solid var(--accent);outline-offset:2px;border-color:var(--accent)}
.feedback{margin-top:16px;padding:14px 16px;background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--radius)}
.xp-badge{display:inline-block;padding:2px 12px;border:1px solid var(--accent);border-radius:4px;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:.95rem}

/* sheets, dialogs */
#explore{position:fixed;inset:0;z-index:40;display:none}#explore.open{display:block}
.explore-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.explore-sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line-strong);border-radius:12px 12px 0 0}
.explore-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-size:1.15rem}
.explore-search{padding:12px 16px 4px}
.explore-search input{width:100%;height:52px;padding:0 14px;border:2px solid var(--line-strong);border-radius:6px;background:var(--paper);font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px}
.explore-list{overflow:auto;padding:4px 16px 18px;display:grid;gap:8px}
.explore-item{width:100%;min-height:54px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line-strong);border-radius:6px;background:var(--paper)}
.explore-item:hover{background:var(--accent-soft)}
.explore-item small{color:var(--muted);font-size:.95rem}
.done-screen{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:var(--bg);overflow:auto}
.done-screen.show{display:grid}
.done-card{position:relative;overflow:hidden;width:100%;max-width:28rem;margin:auto;padding:24px;text-align:center;background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--radius)}
.set-card{max-width:32rem;text-align:left}
.chart-card{max-width:44rem;text-align:left}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.done-ico{color:var(--accent)}
.set-h{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:1.25rem}
.set-sec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.set-sec h3{margin:0 0 8px;font-size:1.05rem}
.set-sec p{margin:0;color:var(--muted);line-height:1.55}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.cl{display:flex;align-items:center;gap:10px;min-height:44px}
.cl input,.pick input{width:22px;height:22px;accent-color:var(--accent)}
.cl-row{display:flex;flex-wrap:wrap;gap:4px 18px}
.level-bar{height:10px;background:var(--soft2);border-radius:5px;overflow:hidden}
.level-bar i{display:block;height:100%;width:0;background:var(--accent)}
.level-text{font-size:1rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border:1px solid var(--line-strong);border-radius:4px;font-size:1rem}
.chart-t{width:100%;border-collapse:collapse;margin-top:10px;font-size:1rem}
.chart-t th,.chart-t td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.chart-t small{display:block;color:var(--muted);font-size:.9rem}
.st-row{padding:8px 0;border-bottom:1px solid var(--line)}
.st-row.bad{color:var(--bad-ink);background:var(--bad-bg);padding:8px 12px;border-radius:6px}
.st-list{margin-top:6px;font-weight:400;font-size:.95rem}

/* welcome + picker */
.welcome-screen{position:fixed;inset:0;z-index:60;display:none;overflow:auto;padding:20px 16px 32px;background:var(--bg)}
.welcome-screen.show{display:block}
.welcome-card{max-width:36rem;margin:0 auto;padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}
.welcome-title{font-size:clamp(1.6rem,5vw,2.1rem);line-height:1.15;font-weight:700;margin:4px 0 16px}
.welcome-grid{display:grid;gap:12px}
.welcome-choice{width:100%;text-align:left;padding:14px 16px;border:2px solid var(--line-strong);border-radius:8px;background:var(--paper)}
.welcome-choice:hover{background:var(--accent-soft)}
.welcome-choice.on{border-color:var(--accent);background:var(--accent-soft)}
.wc-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:1.15rem}
.wc-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-size:.95rem;font-weight:700;flex:none}
.welcome-choice.on .wc-check{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.welcome-choice small{display:block;margin-top:4px;font-size:1rem;color:var(--muted)}
.welcome-actions{margin-top:20px}
.welcome-custom{display:block;width:100%;min-height:48px;margin-top:8px;background:none;border:0;color:var(--accent-ink);font-weight:700;text-decoration:underline}
.pick{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin-top:10px;padding:10px 14px;text-align:left;border:2px solid var(--line-strong);border-radius:8px;background:var(--paper)}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pk{flex:none;width:26px;height:26px;border-radius:6px;border:2px solid var(--line-strong);display:grid;place-items:center;font-weight:700;background:var(--paper)}
.pick.on .pk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.level-choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:10px;margin-top:14px}
.level-choice button{min-height:72px;padding:10px 12px;text-align:left;border:2px solid var(--line-strong);border-radius:8px;background:var(--paper)}
.level-choice button.on{border-color:var(--accent);background:var(--accent-soft)}
.level-choice small{display:block;color:var(--muted);font-size:.95rem}

/* menu + toast */
.menu-overlay{position:fixed;inset:0;z-index:45;display:none;background:rgba(0,0,0,.4)}
.menu-overlay.show{display:block}
.menu-sheet{position:fixed;z-index:46;display:none;flex-direction:column;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom));background:var(--paper);border:1px solid var(--line-strong);border-radius:12px 12px 0 0}
.menu-sheet.show{display:flex}
.menu-sheet button{width:100%;min-height:54px;padding:0 12px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;font-size:1.08rem}
.menu-sheet button:last-child{border-bottom:0}
.menu-sheet button:hover{background:var(--accent-soft)}
#toast{position:fixed;left:50%;top:12px;z-index:80;max-width:calc(100% - 32px);transform:translateX(-50%);padding:10px 16px;border-radius:6px;background:var(--ink);color:var(--on-ink);font-weight:700;opacity:0;pointer-events:none}
#toast.show{opacity:1}

/* themes: extra emphasis where color alone is not enough */
.theme-high .card,.theme-high .box,.theme-high .feedback,.theme-high .done-card,.theme-high .welcome-card{border:2px solid #fff}
.theme-high .btn-primary:disabled{background:#000;color:#fff;border:2px dashed #fff}
.theme-high .tab.active{border-bottom-width:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none!important}}

/* v38: guidance layer */
[hidden]{display:none!important}
.header-controls{flex-wrap:wrap}
.cards{grid-template-columns:minmax(0,1fr)}
.card-top{flex-wrap:wrap}
.check{flex:none}
button{touch-action:manipulation}
html{scroll-padding-bottom:9rem;-webkit-tap-highlight-color:transparent}
.card:focus{outline:none}
.hint{position:relative;display:inline-grid;place-items:center;width:1.7rem;height:1.7rem;margin-left:8px;padding:0;border:1.5px solid var(--line-strong);border-radius:50%;background:var(--paper);color:var(--accent-ink);font-size:.95rem;font-weight:700;line-height:1;vertical-align:middle}
.hint::after{content:"";position:absolute;inset:-9px}
.hint:hover{background:var(--accent-soft)}
.stepper{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;min-height:48px}
.coach{position:fixed;left:12px;right:12px;bottom:var(--coach-bottom,12px);z-index:70;max-width:30rem;max-height:60vh;overflow:auto;margin:0 auto;padding:14px 16px;background:var(--paper);border:2px solid var(--accent);border-radius:10px}
.hintsheet{border-color:var(--line-strong)}
.coach-step{font-size:.95rem;color:var(--muted)}
.coach-title{margin-top:2px;font-size:1.2rem;font-weight:700}
.coach-text{margin:6px 0 0;font-size:1.05rem;line-height:1.45}
.coach-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.coach-actions .btn-primary{width:auto;flex:1 1 9rem;justify-content:center}
.guide-target{outline:4px solid var(--accent)!important;outline-offset:4px;border-radius:6px}
.guide-on main{padding-bottom:22rem}
.guide-on .quiz-body{padding-bottom:16rem}
.quiz-hint{margin-top:12px}
.faq{margin-top:14px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{min-height:52px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.faq p{margin:0 0 12px;color:var(--muted);line-height:1.55}
@media (forced-colors:active){.progress i,.q-progress i,.level-bar i{background:Highlight;forced-color-adjust:none}.check.done{forced-color-adjust:none;background:Highlight;color:HighlightText}.btn-primary,.menu-btn,.speaker,.chip{border:2px solid ButtonText}.guide-target{outline-color:Highlight}}
@media(min-width:640px){.coach{left:auto;right:20px;margin:0;width:24rem}}

/* wider screens */
@media(min-width:640px){
  .tab small{display:block}
  .tab{padding:10px 16px 8px}
  .card{padding:24px}
  .menu-sheet{left:auto;right:20px;top:72px;bottom:auto;width:20rem;max-height:80vh;border-radius:8px}
  .explore-sheet{left:50%;right:auto;bottom:auto;top:6vh;transform:translateX(-50%);width:min(40rem,calc(100% - 32px));max-height:88vh;border-radius:12px}
}
@media(min-width:900px){main{padding-top:20px}h1{font-size:2.1rem}}
@media(max-height:520px){.cta-wrap{position:static}main{padding-bottom:2rem}}
.big-text .cta-wrap{position:static;border-top:0;padding:8px 20px 32px}
.big-text main{padding-bottom:1rem}
.big-text .big{font-size:1.85rem}
.big-text .btn-primary{flex-wrap:wrap}
/* Print */
@media print{body>*:not(#chart){display:none!important}#chart{position:static!important;display:block!important;background:#fff!important}#chart .chart-card{max-height:none!important;overflow:visible!important;box-shadow:none!important}.noprint{display:none!important}}

</style>

function dayStr(off){var d=new Date();d.setDate(d.getDate()+(off||0));return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function simpleHash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))%1000000007;}return h;}
function simpleShuffle(arr,seed){var a=arr.slice();var t=(seed>>>0)+0x6D2B79F5;function r(){t+=0x6D2B79F5;var x=t;x=Math.imul(x^(x>>>15),x|1);x^=x+Math.imul(x^(x>>>7),x|61);return((x^(x>>>14))>>>0)/4294967296;}for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp;}return a;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

var speechVoice=null;
var localEnVoices=[];
function initVoices(){
  try{
    var voices=window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    if(voices.length){
      localEnVoices = voices.filter(function(v){ return v.localService && v.lang && v.lang.toLowerCase().startsWith('en'); });
      speechVoice = voices.find(function(v){return v.lang && v.lang.toLowerCase().replace('_','-')==='en-us' && v.localService;})
        || voices.find(function(v){return v.lang && v.lang.toLowerCase().replace('_','-')==='en-us';})
        || localEnVoices[0]
        || voices.find(function(v){return v.lang && v.lang.toLowerCase().startsWith('en');}) || null;
    }
  }catch(e){}
}
if('speechSynthesis' in window){ initVoices(); window.speechSynthesis.onvoiceschanged=initVoices; }
function speak(text, btn, rate){
  try{
    if(!('speechSynthesis' in window)) { toast('Áudio não suportado neste navegador'); return; }
    var synth = window.speechSynthesis;
    if(synth.paused) synth.resume();
    // some browsers (Chrome Android) ignore rate if you speak right after cancel
    synth.cancel();
    // visual feedback immediately
    if(btn){
      btn.classList.add('playing');
      if(rate < 0.9) toast('Devagar — preste atenção: '+text);
    }
    setTimeout(function(){
      try{
        var u=new SpeechSynthesisUtterance(text);
        u.lang='en-US';
        var r = (typeof rate==='number' && !isNaN(rate)) ? rate : 1.0;
        // FIX: devagar muito mais lento - 0.55 vs 1.0 é bem perceptível
        // antes era 0.65 que em muitos celulares parece igual
        u.rate=r; u.volume=1; u.pitch=1;
        // FIX: vozes remotas do Google ignoram rate no Android. Pra devagar, força voz local.
        if(r < 0.9){
          if(localEnVoices && localEnVoices.length) u.voice = localEnVoices[0];
          else if(speechVoice && speechVoice.localService) u.voice = speechVoice;
          // se não tem voz local, deixa sem voz definida - o browser usa default que respeita rate
        } else {
          if(speechVoice) u.voice=speechVoice;
        }
        if(btn){
          u.onend=function(){btn.classList.remove('playing');};
          u.onerror=function(ev){btn.classList.remove('playing'); if(ev&&(ev.error==='interrupted'||ev.error==='canceled')) return; toast('Não consegui tocar o áudio. Veja Ajuda.');};
        }
        synth.speak(u);
      }catch(e2){
        if(btn) btn.classList.remove('playing');
      }
    }, 90);
  }catch(e){ if(btn) btn.classList.remove('playing'); toast('Erro no áudio'); }
}
document.addEventListener('click',function(e){
  var b=e.target.closest ? e.target.closest('[data-say]') : null;
  if(b){
    var txt=b.getAttribute('data-say')||'';
    var rateAttr=b.getAttribute('data-rate');
    var rate = rateAttr!==null ? parseFloat(rateAttr) : 1.0;
    if(isNaN(rate)) rate=1.0;
    var longTxt=b.getAttribute('data-long');
    if(longTxt && rate < 0.9) txt=longTxt;
    speak(txt, b, rate);
  }
});

function parseEx(v){
  var m=new RegExp('\\b('+v.base+'|'+v.third+')\\b','i').exec(v.exEn);
  if(!m) return {pre:'I ',verb:v.base,post:'',subj:'I'};
  var pre=v.exEn.slice(0,m.index), post=v.exEn.slice(m.index+m[0].length);
  var subj=/^I\b/i.test(v.exEn.trim())?'I':'other';
  return {pre:pre,verb:m[0],post:post,subj:subj};
}
function thirdSentence(v){
  var p=parseEx(v), pre=p.pre, post=p.post;
  if(v.id==='be') return {pre:'She ',post:v.exEn.replace(/^I'm/i,'').replace(/\bmy\b/g,'her')};
  post=post.replace(/\s+(when|before|while|until|after|so)\b[^.]*?(?=\.)/i,'');
  if(p.subj==='I'){
    pre=pre.replace(/^I\b/,'She');
    pre=pre.replace(/\bmy\b/gi,'her').replace(/\bmine\b/gi,'hers').replace(/\bme\b/gi,'her').replace(/\bour\b/gi,'their');
    post=post.replace(/\bmy\b/gi,'her').replace(/\bmine\b/gi,'hers').replace(/\bme\b/gi,'her').replace(/\bour\b/gi,'their');
  }
  return {pre:pre,post:post};
}
function pastSentence(v){
  var p=parseEx(v), pre=p.pre, post=p.post;
  if(v.id==='be') return {pre:'I ',post:' tired yesterday.'};
  post=post.replace(/\s+(when|before|while|until|after|so)\b[^.]*?(?=\.)/i,'');
  post=post.replace(/\btoday\b/gi,'yesterday').replace(/\btonight\b/gi,'last night').replace(/\bnow\b/gi,'then');
  post=post.replace(/\bthis is\b/gi,'this was').replace(/\bwhat I say\b/gi,'what I said');
  if(!/\b(yesterday|last|ago|this morning|earlier)\b/i.test(post)) pre='Last week, '+(p.subj==='I'?pre:pre.charAt(0).toLowerCase()+pre.slice(1));
  return {pre:pre,post:post};
}

function handleAnswer(q,correct,attempted){

      }

    }
  }

  var v=q.verb, gain=q.tries===0?10:5;

  html+='<div class="feedback" style="margin-top:12px"><div style="display:flex;align-items:flex-start;gap:12px"><div style="font-weight:900;font-size:1.0625rem;flex:1;min-width:0;overflow-wrap:anywhere">'+esc(q.full)+'</div><div style="display:flex;gap:8px;flex:none">'+speakerBtnCompact((q.kind==='sentence'||q.kind==='item')?q.full:q.ans)+'</div></div>'
    +'<div style="margin-top:8px;color:var(--muted);font-size:.9rem;font-weight:700">'+formsLine(q,v)+'</div>'
    +pronCue(q.ans)+extraPronNote+ruleHint(q)+'</div>'
    +'<button class="btn-primary" onclick="nextQ()" style="margin-top:16px;height:52px">Continuar</button><button class="link-btn" onclick="reportQ()">Reportar erro nesta pergunta</button>';
  document.getElementById('quizBody').innerHTML=html;

window.runSelfTest=function(){
  var R={blank:[],leak:[],dup:[],opts:[],agree:[],pron:[],err:[],gloss:[]}, gl={};
  VERBS.forEach(function(v){
    (gl[v.pt]=gl[v.pt]||[]).push(v.base);
    ['pres','past','part'].forEach(function(t){
      try{
        var q=buildQ(v,t,'A'), p=q.prompt, nh=p.replace(/\([^)]*\)/,'');
        if((p.match(/___/g)||[]).length!==1) R.blank.push(t+'/'+v.base);
        if(new RegExp('\\b'+q.ans+'\\b','i').test(nh)) R.leak.push(t+'/'+v.base+': '+p);
        if(/\b(\w+)\s+\1\b/i.test(q.full)) R.dup.push(t+'/'+v.base+': '+q.full);
        if(q.bad.length<3||q.bad.indexOf(q.ans)>-1||new Set(q.bad).size!==q.bad.length) R.opts.push(t+'/'+v.base);
        if(t==='pres'){ var pre=thirdSentence(v).pre.trim(); if(/^(we|you|they|i)\b/i.test(pre)||/\b(friends|parents|classes|things|people|kids|students)\b/i.test(pre)) R.agree.push(v.base+': '+p); }
      }catch(e){ R.err.push(v.base+' ('+t+'): '+e.message); }
    });
    [v.base,v.third,v.ing,v.past,v.part].forEach(function(f){ if(!pronFor(f)) R.pron.push(f); });
  });
  Object.keys(gl).forEach(function(k){ if(gl[k].length>1) R.gloss.push(k+': '+gl[k].join(' / ')); });
  var names={blank:'Cada pergunta tem exatamente um espaço',leak:'A resposta não aparece na pergunta',dup:'Sem palavras repetidas',opts:'Opções válidas (3 erradas, diferentes)',agree:'Sujeito concorda com o verbo (she/he/it)',pron:'Pronúncia para todas as formas',err:'Sem erros ao gerar frases',gloss:'Traduções (glosses) sem repetição'};
  var fails=0, h='<div class="done-card set-card"><div class="set-h"><b>Autoteste</b><button class="icon-btn" onclick="closeOv(\'selftest\')" aria-label="fechar">✕</button></div>';
  Object.keys(names).forEach(function(k){
    var bad=R[k], ok=!bad.length; if(!ok) fails++;
    h+='<div class="st-row '+(ok?'ok':'bad')+'"><b>'+(ok?'✓':'✗')+' '+names[k]+'</b>'+(ok?'':' ('+bad.length+')<div class="st-list">'+bad.slice(0,12).map(esc).join('<br>')+(bad.length>12?'<br>…':'')+'</div>')+'</div>';
  });
  h+='<p style="margin-top:12px;font-weight:800">'+(fails?fails+' verificação(ões) com problema.':'Tudo certo ✓')+' • '+VERBS.length+' verbos</p></div>';
  showOv('selftest',h);
  return {fails:fails,R:R};
};

(function(){
  var order=['quiz','explore','doneScreen','picker','settings','chart','selftest','help','welcome'], saved={};
  function el(id){return document.getElementById(id);}
  function isOpen(e){return !!e&&(e.classList.contains('show')||e.classList.contains('open'));}
  function focusables(c){return Array.prototype.filter.call(c.querySelectorAll('button,input,select,textarea,summary,[href]'),function(n){return !n.disabled&&n.offsetParent!==null;});}
  order.forEach(function(id){
    var e=el(id); if(!e) return; var was=isOpen(e);
    new MutationObserver(function(){
      var now=isOpen(e);
      if(now&&!was){ saved[id]=document.activeElement; if(id!=='quiz'){ setTimeout(function(){ var f=focusables(e)[0]; if(f) f.focus(); },30); } }
      else if(!now&&was){ var p=saved[id]; if(p&&p!==document.body&&document.contains(p)&&p.focus){ try{p.focus();}catch(x){} } }
      was=now;
    }).observe(e,{attributes:true,attributeFilter:['class']});
  });
  document.addEventListener('keydown',function(ev){
    var top=null; order.forEach(function(id){ if(isOpen(el(id))) top=el(id); });
    var ms=el('menuSheet');
    if(ev.key==='Escape'&&ms&&ms.classList.contains('show')){ closeMenu(); var mb=el('menuBtn'); if(mb) mb.focus(); return; }
    if(ev.key!=='Tab'||!top) return;
    var f=focusables(top), co=el('coach'); if(co&&!co.hidden) f=f.concat(focusables(co)); if(!f.length) return;
    var first=f[0], last=f[f.length-1], a=document.activeElement;
    if(!top.contains(a)&&!(co&&co.contains(a))){ first.focus(); ev.preventDefault(); }
    else if(ev.shiftKey&&a===first){ last.focus(); ev.preventDefault(); }
    else if(!ev.shiftKey&&a===last){ first.focus(); ev.preventDefault(); }
  });
})();

function allSeenNow(){ return todays.length>0 && todays.every(function(v){ return seen[seenKey(activeTab,v.id)]; }); }

function stepperApply(){
  var cs=cardEls(), n=todays.length; if(!n||!cs.length) return;
  var key=activeTab+'|'+todays.map(function(v){return v.id;}).join(',');
  if(key!==viewKey){ viewKey=key; viewIdx=0; }
  viewIdx=Math.max(0,Math.min(n-1,viewIdx));
  var changed=false;
  for(var i=0;i<=viewIdx;i++){ var k=seenKey(activeTab,todays[i].id); if(!seen[k]){ seen[k]=true; changed=true; } }
  if(changed) save();
  cs.forEach(function(c,i){
    c.hidden=(i!==viewIdx);
    var ch=c.querySelector('.check'); if(ch){ var sn=!!seen[seenKey(activeTab,todays[i].id)]; ch.classList.toggle('done',sn); ch.textContent=sn?'✓':''; }
    var d=c.querySelector('details.details'); if(d&&i===viewIdx&&!d.open) d.open=true;
  });
  var old=document.getElementById('stepNav'); if(old) old.remove();
  var nav=document.createElement('div'); nav.id='stepNav'; nav.className='stepper';
  nav.innerHTML=(viewIdx>0?'<button type="button" class="link-btn" onclick="stepTo(-1)">← Verbo anterior</button>':'<span></span>')
    +(practiceMode()&&viewIdx<n-1?'<button type="button" class="link-btn" onclick="stepTo(1)">Próximo verbo →</button>':'');
  cs[viewIdx].insertAdjacentElement('afterend',nav);
  decorate();
}

function guideTick(){
  if(!guideOn) return;

  var G=GUIDE[gStep], txt=typeof G.text==='function'?G.text():G.text, key=gStep+'|'+txt;

  if(tgt!==gTarget){ if(gTarget) gTarget.classList.remove('guide-target'); gTarget=tgt; if(tgt){ tgt.classList.add('guide-target'); ensureVisible(tgt); } }

      +(G.manual?'<button type="button" class="btn-primary" onclick="guideNext()">'+G.manual+'</button>':'')
      +(gStep<GUIDE.length-1?'<button type="button" class="link-btn" onclick="endGuide()">Sair do guia</button>':'')+'</div>';
  }
  c.hidden=false; c.style.setProperty('--coach-bottom',coachBottom()+'px');
